name: support-bge-m3

services:
  bge-m3:
    image: ${BGE_M3_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:120-1.9}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BGE_M3_PORT:-8081}:80"
    command:
      - --model-id
      - ${BGE_M3_MODEL:-cointegrated/rubert-tiny2}
      - --served-model-name
      - ${BGE_M3_MODEL:-cointegrated/rubert-tiny2}
      - --auto-truncate
    volumes:
      - bge_m3_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  bge_m3_cache:
