name: support-embeddings

services:
  embeddings:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8081}:80"
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-cointegrated/rubert-tiny2}
      - --served-model-name
      - ${EMBEDDING_MODEL:-cointegrated/rubert-tiny2}
      - --auto-truncate
    volumes:
      - embedding_cache:/data
volumes:
  embedding_cache:
