name: support-rabbitmq

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
      - "127.0.0.1:${RABBITMQ_PROMETHEUS_PORT:-15693}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-support}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus && exec rabbitmq-server
    volumes:
      - support_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: ["python", "-m", "support_automation.worker"]
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9100}:9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLASSIFIER_PATH: /app/models/theme_classifier.joblib
      QDRANT_URL: ${QDRANT_DOCKER_URL:-http://host.docker.internal:6335}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-support_kb_rubert_tiny2}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      EMBEDDING_BASE_URL: ${EMBEDDING_DOCKER_URL:-http://host.docker.internal:8081/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-cointegrated/rubert-tiny2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-312}
      REDIS_URL: redis://host.docker.internal:${APP_REDIS_PORT:-6380}/0
      POSTGRES_URL: postgresql://${AUDIT_POSTGRES_USER:-support}:${AUDIT_POSTGRES_PASSWORD:?Set AUDIT_POSTGRES_PASSWORD in .env}@host.docker.internal:${AUDIT_POSTGRES_PORT:-5434}/${AUDIT_POSTGRES_DB:-support}?connect_timeout=3
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_URL:-http://host.docker.internal:3000}
      LITELLM_MODEL: ${LITELLM_MODEL:?Set LITELLM_MODEL in .env}
      LITELLM_URL: ${LITELLM_URL:?Set LITELLM_URL in .env}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      CLASSIFIER_CONFIDENCE_THRESHOLD: ${CLASSIFIER_CONFIDENCE_THRESHOLD:-0.22}
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:?Set RABBITMQ_DOCKER_URL in .env}
      RABBITMQ_MAX_LENGTH: ${RABBITMQ_MAX_LENGTH:-50000}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
      WORKER_METRICS_PORT: 9100
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  support_rabbitmq_data:
