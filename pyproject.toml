[project]
name = "support-ticket-automation"
version = "0.1.0"
description = "PoC автоматизации русскоязычных тикетов поддержки"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "joblib>=1.5",
  "langfuse>=3.9",
  "litellm>=1.75",
  "psycopg[binary]>=3.2",
  "redis>=6.2",
  "scikit-learn>=1.7",
  "streamlit>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

